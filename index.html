<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineup — 12U Boys R785</title>
<style>
  :root{
    --ink:#171b17; --paper:#f1efe8; --card:#fff; --line:#d7d3c6; --muted:#6d7268;
    --red:#d21f1f; --green:#1f7a3d; --gk:#28a05a; --accent:#0e4da4;
    --warn:#b3540e; --bad:#b3261e; --radius:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:16px;}
  button{font-family:inherit;}

  header{background:var(--ink); color:#f4f2ea; padding:10px 14px; display:flex; align-items:center; gap:10px;}
  header h1{margin:0; font-size:17px; text-transform:uppercase; letter-spacing:.03em; flex:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  #teamtabs{display:flex; gap:4px;}
  #teamtabs a{padding:5px 10px; border-radius:8px; font-size:12.5px; font-weight:700; text-decoration:none;
    color:#f4f2ea; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08);}
  #teamtabs a.on{background:#f4f2ea; color:var(--ink); border-color:#f4f2ea;}
  #syncdot{width:10px; height:10px; border-radius:50%; background:#888;}
  #syncdot.live{background:#3ddc74;}
  header button{background:rgba(255,255,255,.12); color:#f4f2ea; border:1px solid rgba(255,255,255,.25);
    border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer;}

  main{max-width:1060px; margin:0 auto; padding:12px 12px 96px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:12px;}

  /* game info */
  .ginfo{display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:8px;}
  .ginfo label{display:flex; flex-direction:column; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.07em; color:var(--muted); gap:3px;}
  .ginfo input,.ginfo select{padding:8px 9px; border:1px solid var(--line); border-radius:8px; font-size:14px; min-width:0; background:#fbfaf5;}
  #schedsel{width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fbfaf5; margin-bottom:8px;}
  @media(max-width:640px){ .ginfo{grid-template-columns:1fr 1fr;} }

  /* roster */
  details.card summary{cursor:pointer; font-weight:700; font-size:15px; list-style:none; display:flex; align-items:center;}
  details.card summary::after{content:"▾"; margin-left:auto; color:var(--muted);}
  details[open].card summary::after{content:"▴";}
  .prow{display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid #eeeadf;}
  .prow:last-of-type{border-bottom:none;}
  .prow input.num{width:46px; padding:6px 4px; text-align:center; border:1px solid var(--line); border-radius:7px; font-size:14px; background:#fbfaf5;}
  .prow .pname{flex:1; font-weight:600; font-size:15px;}
  .prow.out .pname{color:var(--muted); text-decoration:line-through;}
  .prow .why{font-size:12px; color:var(--red); font-weight:600;}
  .prow button{border:1px solid var(--line); background:#faf8f2; border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer;}
  .prow button.outbtn.active{background:var(--red); border-color:var(--red); color:#fff;}
  .prow button.inbtn.active{background:var(--green); border-color:var(--green); color:#fff;}
  .prow button.delbtn{color:var(--muted); padding:6px 9px;}
  .addrow{display:flex; gap:8px; margin-top:10px;}
  .addrow input{flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px;}
  .addrow button{padding:8px 12px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer;}
  #missing{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center;}
  #missing .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; width:100%;}
  #missing button{border:1px dashed var(--line); background:#faf8f2; border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer; color:var(--ink);}

  /* controls */
  .toolbar{display:flex; gap:8px; align-items:center; margin:0 0 10px; flex-wrap:wrap;}
  .toolbar select,.toolbar button{padding:8px 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--card); font-size:13.5px; cursor:pointer;}
  .toolbar .primary{background:var(--accent); color:#fff; border-color:var(--accent);}

  /* quarters grid */
  #quarters{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:760px){ #quarters{grid-template-columns:1fr;} }
  .qpanel{background:var(--card); border:1.5px solid var(--ink); border-radius:10px; padding:10px 10px 8px; position:relative;}
  .qhead{display:flex; align-items:center; margin-bottom:6px;}
  .qhead .qt{color:var(--red); font-weight:800; font-size:15px;}
  .qhead .mini{margin-left:auto; display:flex; gap:5px;}
  .qhead .mini button{border:1px solid var(--line); background:#faf8f2; border-radius:7px;
    padding:4px 8px; font-size:11.5px; cursor:pointer; color:var(--ink);}
  .lr{position:absolute; top:8px; font-weight:800; color:#9a9a90; font-size:12px;}
  .lr.l{left:10px;} .lr.r{right:10px;}

  .prowline{display:flex; justify-content:center; gap:4%; margin:7px 0;}
  .pcell{width:29%; min-width:86px;}
  .pcell.w2{width:38%;}
  .plabel{font-size:8.5px; text-transform:uppercase; letter-spacing:.06em; color:#555;
    text-align:center; margin-bottom:2px; white-space:nowrap;}
  .pbox{border:1.6px solid var(--ink); border-radius:3px; height:38px; display:flex; align-items:center;
    padding:0 7px; font-size:14px; font-weight:600; background:#fff; cursor:pointer; user-select:none; position:relative;}
  .pbox.gk{border-color:var(--gk); box-shadow:inset 0 0 0 1px var(--gk);}
  .pbox.emptyb{color:#b9b5a8; font-weight:500; font-style:italic;}
  .pbox.droptarget{background:#fff4d6; border-color:#d8a012;}
  .pbox .pn{overflow:hidden; white-space:nowrap; text-overflow:ellipsis; touch-action:none; cursor:grab; flex:1;}
  .pbox .cnt{font-size:10px; font-weight:800; background:var(--ink); color:#fff; border-radius:8px;
    min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; margin-left:5px; flex-shrink:0;}
  .pbox .cnt.full{background:var(--red);}
  .benchline{margin-top:8px; padding-top:6px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--muted); min-height:20px;}
  .benchline b{color:var(--ink); font-size:10px; letter-spacing:.08em;}

  /* tally + banner */
  .tally{display:flex; flex-wrap:wrap; gap:0 18px;}
  .tally .t{width:calc(50% - 9px); display:flex; align-items:baseline; font-size:13.5px;
    padding:4px 0; border-bottom:1px dotted #d8d4c6; cursor:pointer;}
  .tally .tdet{width:100%; font-size:12px; color:var(--muted); padding:3px 0 6px; border-bottom:1px dotted #d8d4c6;}
  @media(max-width:560px){ .tally .t{width:100%;} }
  .tally .t .nm{flex:1;}
  .tally .t.outp .nm{color:var(--muted); text-decoration:line-through;}
  .tally .t .qs{font-family:ui-monospace,'Courier New',monospace; font-weight:700; letter-spacing:2px; color:var(--green);}
  .tally .t .tot{width:36px; text-align:right; font-weight:800;}
  .tally .t .tot.full{color:var(--red);}
  .tally .t .tot.low{color:var(--bad);}
  .banner{border-radius:10px; padding:10px 12px; font-size:13.5px; line-height:1.45; margin-bottom:12px;}
  .banner.ok{background:#e5f2e8; color:var(--green); border:1px solid #bfe0c8;}
  .banner.warn{background:#fdf0e4; color:var(--warn); border:1px solid #f2d3b3;}
  .banner.bad{background:#fbe9e7; color:var(--bad); border:1px solid #f0c4bf;}

  /* season history */
  #histsub{font-size:12px; color:var(--muted); font-weight:400; display:block; margin-top:2px;}
  #histwrap{overflow-x:auto;}
  table.hist{border-collapse:collapse; margin-top:8px; width:100%; font-size:13px;}
  .hist th,.hist td{padding:5px 8px; border-bottom:1px solid #eeeadf; text-align:center; white-space:nowrap;}
  .hist th{font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:700;}
  .hist td.nm,.hist th.nm{text-align:left;}
  .hist tr.prow2{cursor:pointer;}
  .hist td.z{color:#c9c5b8;}
  .hist td.z.gap{background:#fdf0e4; color:var(--warn); font-weight:700;}
  .hist td.hit{font-weight:700;}
  .hist tr.histdet td{text-align:left; font-size:12px; color:var(--muted); background:#faf8f2; white-space:normal;}
  #histgames{margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;}
  #histgames .g{display:flex; align-items:center; gap:6px; font-size:12px; border:1px solid var(--line);
    background:#faf8f2; border-radius:8px; padding:4px 8px;}
  #histgames .g button{border:none; background:none; color:var(--muted); font-size:14px; cursor:pointer; padding:0 2px;}
  #loggame{margin-top:10px; padding:8px 12px; border-radius:8px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; cursor:pointer; font-size:13.5px;}

  /* coach gate */
  #gate{position:fixed; inset:0; background:var(--paper); z-index:300; display:none; align-items:center; justify-content:center; padding:20px;}
  #gate .gbox{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; width:min(340px,90vw); text-align:center;}
  #gate .gtitle{font-weight:800; font-size:16px; text-transform:uppercase; letter-spacing:.05em;}
  #gate .gsub{font-size:13px; color:var(--muted); margin:6px 0 14px;}
  #gate input{width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:16px; text-align:center; margin-bottom:10px; background:#fbfaf5;}
  #gate button{width:100%; padding:10px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-size:14.5px; cursor:pointer;}
  #gate #gatemsg{font-size:12.5px; color:var(--bad); margin-top:8px; min-height:16px;}

  footer{position:fixed; bottom:0; left:0; right:0; background:rgba(241,239,232,.97); backdrop-filter:blur(6px);
    border-top:1px solid var(--line); padding:8px 12px calc(8px + env(safe-area-inset-bottom)); z-index:40;}
  footer .inner{max-width:1060px; margin:0 auto; display:flex; gap:8px;}
  footer button{flex:1; padding:11px 0; border-radius:10px; border:1px solid var(--line); background:var(--card);
    font-size:13.5px; cursor:pointer; font-weight:600; color:var(--ink);}
  footer button.primary{background:var(--ink); color:#fff; border-color:var(--ink);}

  .ghost{position:fixed; z-index:99; pointer-events:none; opacity:.95; background:#fff; border:1.6px solid var(--ink);
    border-radius:3px; padding:6px 10px; font-size:14px; font-weight:600; transform:translate(-50%,-50%); box-shadow:0 4px 10px rgba(0,0,0,.25);}

  /* picker sheet */
  #shade{position:fixed; inset:0; background:rgba(20,24,20,.4); z-index:50; display:none;}
  #sheet{position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:16px 16px 0 0; z-index:51;
    max-height:70vh; overflow:auto; display:none; padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(0,0,0,.25); max-width:560px; margin:0 auto;}
  #sheet h3{margin:0 0 2px; font-size:15px;}
  #sheet p{margin:0 0 10px; color:var(--muted); font-size:12.5px;}
  #sheet .opt{display:flex; align-items:center; gap:10px; padding:11px 4px; border-top:1px solid #eee; cursor:pointer; font-size:15px;}
  #sheet .opt .b{margin-left:auto; font-size:11px; font-weight:800; background:#eee; border-radius:9px; padding:2px 8px;}
  #sheet .opt .b.full{background:var(--red); color:#fff;}
  #sheet .opt.cur{background:#f4f8ff;}
  #sheet .opt.clear{color:var(--bad); font-weight:600;}
  #sheet .opt small{color:var(--muted);}

  .toast{position:fixed; left:50%; bottom:84px; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:9px 16px; border-radius:20px; font-size:13.5px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; max-width:88%; text-align:center;}
  .toast.show{opacity:1;}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;} }

  /* =================== PRINT: two documents =================== */
  #printcard,#printgame{display:none;}
  @media print{
    html,body{height:auto; margin:0; background:#fff;}
    header,main,footer,.toast,#shade,#sheet{display:none !important;}
    body[data-print="lineup"] #printcard{display:flex;}
    body[data-print="gamecard"] #printgame{display:grid;}
    /* Field card fills the full landscape page (letter minus 8mm margins ≈ 263×200mm) */
    #printcard{color:#000; font-family:Arial,Helvetica,sans-serif;
      border:3px solid #000; height:197mm; flex-direction:column; page-break-inside:avoid;}
    .plu-head{display:flex; border-bottom:3px solid #000; align-items:stretch; flex:0 0 13mm;}
    .plu-head .cell{border-right:1.5px solid #000; padding:1.5mm 2mm; font-size:11px; color:#c22;}
    .plu-head .cell b{color:#000; font-size:12px;}
    .plu-head .nine{font-size:30px; font-weight:900; color:#000; display:flex; align-items:center; padding:0 6mm;}
    .plu-head .hv{display:flex; flex-direction:column; justify-content:center; gap:1.5mm; font-size:11px; color:#c22;}
    .plu-head .hv .cb{display:inline-block; width:3mm; height:3mm; border:1.5px solid #000; margin-right:1.5mm; vertical-align:-0.5mm;
      text-align:center; line-height:3mm; font-weight:900; font-size:9px; color:#000;}
    .plu-head .grow{flex:1;}
    .plu-head .fnum{font-size:30px; font-weight:900; color:#fff; -webkit-text-stroke:1.5px #c22;
      letter-spacing:1mm; display:flex; align-items:center; padding:0 4mm; border-right:none;}
    .plu-quads{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; min-height:0;}
    .plu-q{border-right:2.5px solid #000; border-bottom:2.5px solid #000; padding:3mm 6mm 2mm; position:relative;
      display:flex; flex-direction:column; min-height:0;}
    .plu-q:nth-child(2n){border-right:none;}
    .plu-q:nth-child(3),.plu-q:nth-child(4){border-bottom:none;}
    .plu-q .lr{position:absolute; top:2mm; font-weight:800; color:#777; font-size:13px;}
    .plu-q .lr.l{left:3mm;} .plu-q .lr.r{right:3mm;}
    .plu-row{flex:1; display:flex; justify-content:center; gap:5%; align-items:center; min-height:0;}
    .plu-cell{width:27%;}
    .plu-cell.w2{width:34%;}
    .plu-lab{font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; text-align:center; margin-bottom:0.5mm; white-space:nowrap;}
    .plu-box{border:1.6px solid #000; height:9mm; font-size:14px; font-weight:600; display:flex; align-items:center;
      padding:0 2mm; overflow:hidden; white-space:nowrap;}
    .plu-box.gk{border-color:#28a05a; box-shadow:inset 0 0 0 1px #28a05a;}
    .plu-qlab{position:absolute; right:9mm; bottom:16mm; color:#c22; font-weight:800; font-size:15px;}
    .plu-bench{display:flex; align-items:stretch; gap:2mm; flex:0 0 8mm; margin-top:1.5mm;}
    .plu-bench .bl{writing-mode:vertical-rl; transform:rotate(180deg); font-size:7px; letter-spacing:.1em; color:#555; text-align:center;}
    .plu-bench .bb{flex:1; border:1.2px solid #999; font-size:11px; display:flex; align-items:center; padding:0 1.5mm; overflow:hidden; white-space:nowrap;}

    /* ----- Team Line Up Report (game card): the official form is embedded as an
       image (GAMECARD_BG, extracted from the region's PDF) and player/team info is
       absolutely positioned over its cells in % coordinates measured off that scan.
       Both the image and the overlays scale with the .gc box, so alignment holds. ----- */
    #printgame{color:#000; height:260mm;
      grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2mm; page-break-inside:avoid;}
    .gc{position:relative; overflow:hidden;}
    .gc img.bg{position:absolute; inset:0; width:100%; height:100%;}
    .gc .ov{position:absolute; font-family:Arial,Helvetica,sans-serif; color:#000; font-size:2.3mm; line-height:1;
      display:flex; align-items:center; height:2.91%; overflow:hidden; white-space:nowrap;}
    .gc .ov.j{left:4.3%; width:10.5%;}
    .gc .ov.n{left:16.2%; width:40%;}
    .gc .ov.m{left:21.6%; width:60%; height:1.5%;}
    .gc .ov.d{align-items:flex-end; justify-content:center; height:1.6%;}
    .gc .ov .strike{text-decoration:line-through;}
    .gc .ov .abs{font-style:italic; font-size:1.9mm; margin-left:1mm;}
  }
</style>
<style id="pagestyle">@media print{@page{size:letter landscape; margin:8mm;}}</style>
</head>
<body data-print="lineup">

<header>
  <h1>12U Boys · R785</h1>
  <nav id="teamtabs"><a class="on" href="./">12U</a><a href="u8/">8U</a></nav>
  <div id="syncdot" title="Sync status"></div>
  <button id="sharebtn">Share link</button>
  <button id="newgame">New game</button>
</header>

<div id="gate">
  <div class="gbox">
    <div class="gtitle">Coaches only</div>
    <div class="gsub">Enter the team passcode to unlock the lineup.</div>
    <input id="gatecode" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Passcode" aria-label="Team passcode">
    <button id="gatego">Unlock</button>
    <div id="gatemsg"></div>
  </div>
</div>

<main>
  <div class="card">
    <select id="schedsel" aria-label="Load game from schedule"></select>
    <div class="ginfo">
      <label>Opponent<input id="f-opp" placeholder="Team name"></label>
      <label>Date<input id="f-date" type="date"></label>
      <label>Time<input id="f-time" type="time"></label>
      <label>Game #<input id="f-num" placeholder="—"></label>
      <label>Field<input id="f-field" placeholder="e.g. Morley 3"></label>
      <label>Home/Away<select id="f-ha"><option value="">—</option><option value="home">Home</option><option value="away">Away</option></select></label>
    </div>
  </div>

  <details class="card" id="cardbox">
    <summary>Game card details</summary>
    <div class="ginfo" style="margin-top:10px">
      <label>Team name<input id="f-team"></label>
      <label>Team colors<input id="f-colors" placeholder="—"></label>
      <label>Team coach<input id="f-coach"></label>
      <label>Ass. coach<input id="f-ass"></label>
    </div>
  </details>

  <details class="card" id="rosterbox">
    <summary>Roster & availability</summary>
    <div id="plist" style="margin-top:8px"></div>
    <div class="addrow">
      <input id="newname" placeholder="Add a player (guest / late add)">
      <button id="addbtn">Add</button>
    </div>
    <div id="missing"></div>
  </details>

  <div class="toolbar">
    <select id="formation" aria-label="Formation"></select>
    <button id="fillgame" class="primary">Auto-fill whole game</button>
    <button id="cleargame">Clear all quarters</button>
  </div>

  <div id="quarters"></div>

  <div class="card" style="margin-top:12px">
    <b style="font-size:13px; letter-spacing:.06em; text-transform:uppercase;">Playing time</b>
    <span style="font-size:12px; color:var(--muted)"> — tap a player to see their positions this game</span>
    <div class="tally" id="tally" style="margin-top:6px"></div>
  </div>

  <div class="banner ok" id="banner"></div>

  <div class="card">
    <b style="font-size:13px; letter-spacing:.06em; text-transform:uppercase;">Season positions</b>
    <span id="histsub">Quarters at each line this season — watch who's specializing. Tap a player for the exact positions.</span>
    <div id="histwrap"></div>
    <div id="histgames"></div>
    <button id="loggame">Log this game to the season</button>
  </div>
</main>

<footer>
  <div class="inner">
    <button id="printbtn" class="primary">Print lineup</button>
    <button id="printgc" class="primary">Print game card</button>
    <button id="checkbtn">Check 75%</button>
  </div>
</footer>

<div id="shade"></div>
<div id="sheet"></div>
<div class="toast" id="toast"></div>
<div id="printcard" aria-hidden="true"></div>
<div id="printgame" aria-hidden="true"></div>

<script>
"use strict";

/* =========================================================================
   OPTIONAL LIVE SYNC — paste your Firebase web config here to let two
   phones edit the same lineup in real time. Free tier is plenty.
   1) console.firebase.google.com → new project → Realtime Database →

   2) Project settings → your apps → Web app → copy the config object.
   3) Paste it below and redeploy. Leave as null for local-only +
      share-by-link mode.
   ========================================================================= */
const FIREBASE_CONFIG = {

  authDomain:"game-lineup.firebaseapp.com",

  apiKey:"...", authDomain:"xxx.firebaseapp.com",
  databaseURL:"https://xxx-default-rtdb.firebaseio.com",
  projectId:"xxx", appId:"..."
};
*/

/* The official AYSO Team Line Up Report form (Region 785, 12U-Boys), extracted

/* ---------- formations (9v9) ---------- */
const FORMATIONS = {
  "3-3-2": [["LEFT STRIKER","RIGHT STRIKER"],
            ["LEFT MID","CENTER MID","RIGHT MID"],
            ["LEFT BACK","CENTER BACK","RIGHT BACK"],
            ["GOAL KEEPER"]],
  "3-2-3": [["LEFT WING","STRIKER","RIGHT WING"],
            ["LEFT MID","RIGHT MID"],
            ["LEFT BACK","CENTER BACK","RIGHT BACK"],

  "2-3-3": [["LEFT WING","STRIKER","RIGHT WING"],
            ["LEFT MID","CENTER MID","RIGHT MID"],
            ["LEFT BACK","RIGHT BACK"],
            ["GOAL KEEPER"]]
};
function flatPositions(f){ const out=[]; FORMATIONS[f].forEach(r=>r.forEach(l=>out.push(l))); return out; }

/* No player names in this public file. The roster lives in the gated database
   and in each coach's local save — a fresh device syncs it right after
   unlocking. The Add box covers guests, late adds, and offline first runs. */

   Source: MatchTrak via the Pi's /api/soccer.json, pulled 2026-08-25. Times may

function posLine(lb){ return lb.includes("KEEPER")?"GK":lb.includes("BACK")?"DEF":lb.includes("MID")?"MID":"FWD"; }

/* ---------- state ---------- */
let S=load();
function freshState(){
  return { v:3, opponent:"", date:"", time:"", gameNo:"", field:"", homeAway:"", formation:"3-3-2",
    teamName:"BU12 - Lynch", teamColors:"Orange", coach:"Lynch, Brian", assCoach:"Cissel, Sean",
    players:DEFAULT_ROSTER.map((n,i)=>({id:"p"+i,name:n,num:"",out:false,reason:""})),
    quarters:[{},{},{},{}], nextId:DEFAULT_ROSTER.length, history:[],
    ts:0 };  // 0 = untouched default; any synced lineup outranks it (save() stamps real edits)
}
function migrate(s){
  const d=freshState();
  for(const k of ["field","teamName","teamColors","coach","assCoach","homeAway"]) if(s[k]===undefined) s[k]=d[k];
  if(!FORMATIONS[s.formation]){ s.formation=d.formation; s.quarters=[{},{},{},{}]; } // saved under a retired format
  if(!s.teamColors) s.teamColors="Orange"; // uniform is orange, only color — backfill older saves
  if(!s.homeAway){ // game picked before home/away existed — recover it from the schedule
    const g=SCHEDULE.find(g=>g.date===s.date&&g.opp===s.opponent);
    if(g) s.homeAway=g.ha;
  }
  s.players.forEach(p=>{ if(p.num===undefined)p.num=""; if(p.reason===undefined)p.reason=""; });
  // season history: backfill on old saves + undo RTDB array→object coercion on synced data
  s.history=Object.values(s.history||{}).filter(Boolean).map(g=>({...g,
    players:Object.values(g.players||{}).filter(Boolean).map(p=>({...p,pos:Object.values(p.pos||{}).filter(Boolean)}))}));
  return s;
}
function load(){
  try{
    let raw=localStorage.getItem(KEY);
    if(!raw){ // migrate v1 if present
      const old=localStorage.getItem("lineup-12u-v1");
      if(old){ const o=JSON.parse(old);
        const s=freshState();
        if(o.players) s.players=o.players.map(p=>({num:"",reason:"",...p}));
        if(o.quarters) s.quarters=o.quarters;
        if(o.opponent) s.opponent=o.opponent;
        if(o.date) s.date=o.date;
        return s;
      }
      return freshState();
    }
    const s=JSON.parse(raw);
    if(s&&s.players&&s.quarters) return migrate(s);
  }catch(e){}
  return freshState();
}
function save(fromRemote){
  S.ts=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  if(!fromRemote) pushRemote();
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const byId=id=>S.players.find(p=>p.id===id);
const firstName=n=>n.split(/\s+/)[0];
const shortName=n=>{const w=n.split(/\s+/);return w[0]+(w[1]?" "+w[1][0]+".":"");};
const availablePlayers=()=>S.players.filter(p=>!p.out);
function quartersPlayed(pid){ return S.quarters.reduce((a,qt)=>a+(Object.values(qt).includes(pid)?1:0),0); }
function slotOf(pid,qi){ const qt=S.quarters[qi]; for(const k in qt) if(qt[k]===pid) return +k; return -1; }
function removeFromQuarter(pid,qi){ const s=slotOf(pid,qi); if(s>=0) delete S.quarters[qi][s]; }
function gkIndex(){ return flatPositions(S.formation).length-1; }

/* ---------- rules ---------- */
function ruleReport(){
  const avail=availablePlayers();
  const counts=avail.map(p=>({p,q:quartersPlayed(p.id)}));
  const nSlots=flatPositions(S.formation).length, total=4*nSlots;
  const filled=S.quarters.reduce((a,qt)=>a+Object.keys(qt).length,0);
  const full=counts.filter(c=>c.q>=4), under3=counts.filter(c=>c.q<3), under2=counts.filter(c=>c.q<2);
  const out=[]; let level="ok";
  if(full.length&&under3.length){
    level="bad";
    out.push("<b>75% rule broken:</b> "+full.map(c=>firstName(c.p.name)).join(", ")+
      (full.length>1?" are":" is")+" down for the full game, but "+
      under3.map(c=>firstName(c.p.name)+" ("+c.q+"Q)").join(", ")+
      (under3.length>1?" haven't":" hasn't")+" hit 3 quarters.");
  }
  if(filled===total&&under2.length){
    if(level!=="bad") level="warn";
    out.push("<b>AYSO minimum:</b> "+under2.map(c=>firstName(c.p.name)).join(", ")+" under 2 quarters (half-game minimum).");
  }
  const n=avail.length;
  if(n>0){
    const maxFull=Math.max(0,Math.min(n,total-3*n));
    out.push(n+" available · "+nSlots+" on the field · "+
      "<b>"+maxFull+"</b> can go the full game with everyone else at 3 quarters."+
      (n<=nSlots?" (No bench today — everyone plays 100%.)":""));
  }
  if(level==="ok"&&filled===total&&!under3.length) out.unshift("<b>All good.</b> Everyone's at 3+ quarters.");
  return {level,html:out.join("<br>")};
}

/* ---------- season history ----------
   Each logged game snapshots who played which position in which quarter
   ({name, pos:[label per quarter played]}); the matrix sums quarters by line.
   Games are keyed by date+opponent, so re-logging a game replaces it. */
function logGame(quiet){
  const labels=flatPositions(S.formation);
  const perPlayer=new Map();
  S.quarters.forEach(qt=>{ for(const k in qt){ const p=byId(qt[k]);
    if(p){ if(!perPlayer.has(p.id)) perPlayer.set(p.id,[]); perPlayer.get(p.id).push(labels[+k]); } } });
  if(!perPlayer.size){ if(!quiet) toast("Nothing to log — no one is placed in any quarter."); return false; }
  if(!S.date&&!S.opponent){ if(!quiet) toast("Set a date or opponent first so the game can be identified."); return false; }
  const rec={date:S.date||"",opp:S.opponent||"",ha:S.homeAway||"",formation:S.formation,
    players:[...perPlayer].map(([pid,pos])=>({name:byId(pid).name,pos}))};
  const gkey=g=>g.date+"|"+g.opp;
  const i=S.history.findIndex(g=>gkey(g)===gkey(rec));
  if(i>=0) S.history[i]=rec; else S.history.push(rec);
  S.history.sort((a,b)=>gkey(a).localeCompare(gkey(b)));
  save(); renderHistory();
  if(!quiet) toast((i>=0?"Updated":"Logged")+" "+(rec.opp?"vs "+rec.opp:rec.date)+" in the season history.");
  return true;
}
function renderHistory(){
  const wrap=$("#histwrap"), games=$("#histgames");
  if(!S.history.length){
    wrap.innerHTML='<div style="font-size:13px;color:var(--muted);margin-top:8px">No games logged yet. '+
      'After each game, tap “Log this game” — starting a new game logs the finished one automatically.</div>';
    games.innerHTML=""; return;
  }
  const tot=new Map(), exact=new Map(); // name -> line counts / exact-position counts
  S.history.forEach(g=>g.players.forEach(pl=>{
    if(!tot.has(pl.name)){ tot.set(pl.name,{GK:0,DEF:0,MID:0,FWD:0,games:0}); exact.set(pl.name,new Map()); }
    const t=tot.get(pl.name), ex=exact.get(pl.name); t.games++;
    pl.pos.forEach(lb=>{ t[posLine(lb)]++; ex.set(lb,(ex.get(lb)||0)+1); });
  }));
  const names=[...new Set([...S.players.map(p=>p.name),...tot.keys()])]
    .sort((a,b)=>lastFirst(a).localeCompare(lastFirst(b)));
  let html='<table class="hist"><tr><th class="nm">Player</th>';
  LINES.forEach(([,lab])=>html+="<th>"+lab+"</th>");
  html+="<th>Games</th></tr>";
  names.forEach((n,ri)=>{
    const t=tot.get(n)||{GK:0,DEF:0,MID:0,FWD:0,games:0};
    html+='<tr class="prow2" data-n="'+ri+'"><td class="nm">'+esc(shortName(n))+'</td>';
    LINES.forEach(([key])=>{
      html+=t[key]?'<td class="hit">'+t[key]+'</td>':'<td class="z'+(TRACK_GAPS?' gap':'')+'">·</td>';
    });
    html+='<td>'+(t.games||"·")+'</td></tr>';
  });
  html+="</table>";
  wrap.innerHTML=html;
  wrap.querySelectorAll("tr.prow2").forEach(tr=>{ tr.onclick=()=>{ // toggle exact-position breakdown
    const open=tr.nextElementSibling&&tr.nextElementSibling.classList.contains("histdet");
    wrap.querySelectorAll("tr.histdet").forEach(r=>r.remove());
    if(open) return;
    const n=names[+tr.dataset.n], ex=exact.get(n);
    const txt=ex&&ex.size?[...ex].sort((a,b)=>b[1]-a[1]).map(([lb,c])=>lb.toLowerCase()+" ×"+c).join(", "):"no quarters logged yet";
    tr.insertAdjacentHTML("afterend",'<tr class="histdet"><td colspan="'+(LINES.length+2)+'">'+esc(txt)+'</td></tr>');
  };});
  games.innerHTML="";
  S.history.forEach((g,i)=>{
    const d=g.date?new Date(g.date+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}):"—";
    const el=document.createElement("span"); el.className="g";
    el.textContent=d+(g.opp?" vs "+g.opp:"")+(g.ha?" ("+g.ha+")":"");
    const x=document.createElement("button"); x.textContent="✕"; x.title="Remove this game from the season history";
    x.onclick=()=>{ if(confirm("Remove "+(g.opp?"the "+g.opp+" game":"this game")+" from the season history?")){
      S.history.splice(i,1); save(); renderHistory(); } };
    el.appendChild(x); games.appendChild(el);
  });
}

/* ---------- drag between boxes (any quarter) ---------- */
let dragMoved=false;
function attachDrag(pn){
  let ghost=null,sx=0,sy=0,dragging=false;
  pn.addEventListener("pointerdown",e=>{
    sx=e.clientX; sy=e.clientY; dragging=false; dragMoved=false;
    pn.setPointerCapture(e.pointerId);
  });
  pn.addEventListener("pointermove",e=>{
    if(!pn.hasPointerCapture(e.pointerId)) return;
    if(!dragging&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){
      dragging=true; dragMoved=true;
      ghost=document.createElement("div"); ghost.className="ghost"; ghost.textContent=pn.textContent;
      document.body.appendChild(ghost);
      pn.closest(".pbox").style.opacity=".4";
    }
    if(dragging){
      ghost.style.left=e.clientX+"px"; ghost.style.top=e.clientY+"px";
      document.querySelectorAll(".pbox.droptarget").forEach(b=>b.classList.remove("droptarget"));
      const t=boxAt(e.clientX,e.clientY); if(t) t.classList.add("droptarget");
    }
  });
  pn.addEventListener("pointerup",e=>{
    if(!dragging){ return; }             // plain tap → box click opens picker
    const t=boxAt(e.clientX,e.clientY);
    document.querySelectorAll(".pbox.droptarget").forEach(b=>b.classList.remove("droptarget"));
    ghost.remove(); pn.closest(".pbox").style.opacity="";
    if(t){
      const fromQ=+pn.dataset.q, fromSlot=+pn.dataset.slot, pid=pn.dataset.pid;
      const toQ=+t.dataset.q, toSlot=+t.dataset.slot;
      const occ=S.quarters[toQ][toSlot];
      if(!(fromQ===toQ&&fromSlot===toSlot)){
        delete S.quarters[fromQ][fromSlot];
        if(occ&&fromQ===toQ) S.quarters[fromQ][fromSlot]=occ;   // same-quarter swap
        if(occ&&fromQ!==toQ&&slotOf(pid,toQ)>=0) removeFromQuarter(pid,toQ);
        if(fromQ!==toQ) removeFromQuarter(pid,toQ);              // no doubles in a quarter
        S.quarters[toQ][toSlot]=pid;
      }
      save(); render();
    } else render();
    setTimeout(()=>{dragMoved=false;},60);
  });
  pn.addEventListener("pointercancel",()=>{ if(ghost)ghost.remove();
    const b=pn.closest(".pbox"); if(b)b.style.opacity="";
    document.querySelectorAll(".pbox.droptarget").forEach(x=>x.classList.remove("droptarget")); });
}
function boxAt(x,y){
  for(const b of document.querySelectorAll(".pbox")){
    const r=b.getBoundingClientRect();
    if(x>=r.left-6&&x<=r.right+6&&y>=r.top-6&&y<=r.bottom+6) return b;
  }
  return null;
}

/* ---------- fill / clear ---------- */
function autofill(q){
  const qt=S.quarters[q], n=flatPositions(S.formation).length;
  const onField=new Set(Object.values(qt));
  const pool=availablePlayers().filter(p=>!onField.has(p.id))
    .sort((a,b)=>quartersPlayed(a.id)-quartersPlayed(b.id));
  for(let i=0;i<n;i++){ if(!qt[i]){ const p=pool.shift(); if(p) qt[i]=p.id; } }
}
function fillGame(){ for(let q=0;q<4;q++) autofill(q); save(); render(); toast("Filled by lowest playing time. Now fix positions."); }

/* ---------- coach gate + Firebase live sync ----------
   The database only opens for a signed-in coach: the gate passcode signs into
   one shared Firebase Auth user (its password = salted SHA-256 of the passcode,
   so the passcode never appears in this file), and the DB rules only allow that
   account's uid. Unlock once per device; afterwards the saved auth session (or,
   offline, the unlocked flag + local save) keeps working. To change the
   passcode, set a new password on the shared user in Firebase console →
   Authentication → Users (new password = sha256("R785-lineup:"+passcode) hex). */
let db=null, applyingRemote=false, pushTimer=null, authReady=null;
const GATEOK="lineup-gate-ok";
const GATE_EMAIL="coaches@game-lineup.firebaseapp.com";
async function gatePass(code){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("R785-lineup:"+code));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function showGate(){ $("#gate").style.display="flex"; setTimeout(()=>$("#gatecode").focus(),50); }
function hideGate(){ $("#gate").style.display="none"; }
async function gateSubmit(){
  const code=$("#gatecode").value.trim(); if(!code) return;
  $("#gatemsg").textContent="Checking…";
  try{
    if(!authReady) throw new Error("sync disabled");
    const auth=await Promise.race([authReady,
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000))]);
    await auth.signInWithEmailAndPassword(GATE_EMAIL,await gatePass(code));
    $("#gatecode").value=""; $("#gatemsg").textContent="";
    // onAuthStateChanged hides the gate and attaches sync
  }catch(e){
    $("#gatemsg").textContent=/wrong-password|invalid-credential|invalid-login|user-not-found/i.test((e&&(e.code||e.message))||"")
      ?"Wrong passcode.":"Can't reach the sync server — check the connection and try again.";
  }
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script");
  s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load failed: "+src)); document.head.appendChild(s); }); }
function pushRemote(){
  if(!db) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ db.ref("lineup/current").set(S); },400);
}
function attachDb(){
  if(db) return;
  db=firebase.database();
  $("#syncdot").classList.add("live"); $("#syncdot").title="Live sync on";
  db.ref("lineup/current").on("value",snap=>{
    const remote=snap.val();
    if(!remote||!remote.ts) { pushRemote(); return; }
    if(remote.ts>S.ts){
      // RTDB drops empty objects/arrays and can coerce sparse arrays to
      // objects or null-holed arrays — normalize both before applying
      remote.quarters=[0,1,2,3].map(i=>(remote.quarters&&remote.quarters[i])||{});
      remote.players=Object.values(remote.players||{}).filter(Boolean);
      applyingRemote=true; S=migrate(remote);
      try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
      render(); applyingRemote=false;
    } else if(S.ts>(remote.ts||0)){ pushRemote(); } // our data is newer — seed the shared lineup
  });
}
function initSync(){
  if(!FIREBASE_CONFIG) return;
  authReady=(async()=>{
    await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
    await Promise.all([
      loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"),
      loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js")]);
    firebase.initializeApp(FIREBASE_CONFIG);
    firebase.auth().onAuthStateChanged(u=>{
      if(u){ try{ localStorage.setItem(GATEOK,"1"); }catch(e){} hideGate(); attachDb(); }
      else showGate(); // no session (first visit or cleared storage) — sign in to sync
    });
    return firebase.auth();
  })();
  authReady.catch(e=>console.warn("Sync init failed",e)); // offline: local-only, gate stays as-is
}

/* ---------- print: replica of the 3-3-2 card ---------- */
function buildPrintCard(){
  const digits=S.formation.replace(/[^0-9]/g,"");
  const dateStr=S.date?new Date(S.date+"T12:00:00").toLocaleDateString():"";
  const timeStr=S.time||"";
  let h='<div class="plu-head">'+
    '<div class="cell nine">9v9</div>'+
    '<div class="cell hv"><span><span class="cb">'+(S.homeAway==="home"?"✕":"")+'</span>HOME</span>'+
    '<span><span class="cb">'+(S.homeAway==="away"?"✕":"")+'</span>VISITOR</span></div>'+
    '<div class="cell">Date: <b>'+esc(dateStr)+'</b></div>'+
    '<div class="cell">Time: <b>'+esc(timeStr)+'</b></div>'+
    '<div class="cell">Game #: <b>'+esc(S.gameNo||"")+'</b></div>'+
    '<div class="cell">Field: <b>'+esc(S.field||"")+'</b></div>'+
    '<div class="cell grow">Opponent: <b>'+esc(S.opponent||"")+'</b></div>'+
    '<div class="cell">Half Score:</div>'+
    '<div class="cell">Final Score:</div>'+
    '<div class="fnum">'+digits+'</div></div>';
  h+='<div class="plu-quads">';
  const rows=FORMATIONS[S.formation];
  for(let q=0;q<4;q++){
    h+='<div class="plu-q"><span class="lr l">L</span><span class="lr r">R</span>';
    // print strikers at top like the original (attack up)
    let flat=0;
    const rowHtml=[];
    rows.forEach(row=>{
      let line='<div class="plu-row">';
      row.forEach(label=>{
        const idx=flat++;
        const pid=S.quarters[q][idx]; const p=pid?byId(pid):null;
        const isGK=label==="GOAL KEEPER";
        line+='<div class="plu-cell'+(row.length===2?' w2':'')+'"><div class="plu-lab">'+label+'</div>'+
          '<div class="plu-box'+(isGK?' gk':'')+'">'+(p?esc(p.name):'')+'</div></div>';
      });
      line+='</div>';
      rowHtml.push(line);
    });
    h+=rowHtml.join("");
    h+='<div class="plu-qlab">'+QLAB[q]+'</div>';
    const onField=new Set(Object.values(S.quarters[q]));
    const bench=availablePlayers().filter(p=>!onField.has(p.id));
    h+='<div class="plu-bench"><span class="bl">BENCH</span>';
    for(let i=0;i<Math.max(4,bench.length);i++){
      h+='<div class="bb">'+(bench[i]?esc(shortName(bench[i].name)):'')+'</div>';
    }
    h+='</div></div>';
  }
  h+='</div>';
  $("#printcard").innerHTML=h;
}

/* ---------- print: Team Line Up Report (game card), 4-up ---------- */
function lastFirst(n){
  const w=n.trim().split(/\s+/);
  if(w.length===1) return w[0];
  return w[w.length-1]+", "+w.slice(0,-1).join(" ");
}
function gkQuarters(pid){
  const gk=gkIndex(); const qs=[];
  for(let i=0;i<4;i++) if(S.quarters[i][gk]===pid) qs.push(i+1);
  return qs;
}
function buildGameCard(){
  const dateStr=S.date?new Date(S.date+"T12:00:00").toLocaleDateString():"";
  const sorted=[...S.players].sort((a,b)=>lastFirst(a.name).localeCompare(lastFirst(b.name)));
  // % coordinates measured off the 1693x2228px scan of the official form
  const ROW0=24.73, STEP=2.911;
  let ov="";
  const meta=(top,txt)=>{ if(txt) ov+='<span class="ov m" style="top:'+top+'%">'+esc(txt)+'</span>'; };
  meta(11.8,S.teamName); meta(14.05,S.teamColors); meta(16.29,S.coach); meta(18.58,S.assCoach);
  sorted.slice(0,20).forEach((p,i)=>{
    const top=(ROW0+i*STEP).toFixed(3);
    if(p.num) ov+='<span class="ov j" style="top:'+top+'%">'+esc(p.num)+'</span>';
    let nm='<span'+(p.out?' class="strike"':'')+'>'+esc(lastFirst(p.name))+'</span>';
    if(p.out) nm+='<span class="abs">absent'+(p.reason?" — "+esc(p.reason.toLowerCase()):"")+'</span>';
    ov+='<span class="ov n" style="top:'+top+'%">'+nm+'</span>';
  });
  const dtf=(left,width,txt)=>{ if(txt) ov+='<span class="ov d" style="top:88.3%; left:'+left+'%; width:'+width+'%">'+esc(txt)+'</span>'; };
  dtf(10.2,22.8,dateStr); dtf(43.7,15.2,S.time||""); dtf(69,30.4,S.field||"");
  const card='<div class="gc"><img class="bg" src="'+GAMECARD_BG+'" alt="">'+ov+'</div>';
  $("#printgame").innerHTML=card+card+card+card;
}
function setPrintMode(mode){
  document.body.dataset.print=mode;
  $("#pagestyle").textContent = mode==="gamecard"
    ? "@media print{@page{size:letter portrait; margin:8mm;}}"
    : "@media print{@page{size:letter landscape; margin:8mm;}}";
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2400);
}
function newGame(){
  if(!confirm("Start a new game? The finished game is logged to the season history first; roster, numbers, and formation stay; quarters, opponent, date, time, and outs are cleared.")) return;
  const logged=logGame(true);
  S.quarters=[{},{},{},{}]; S.opponent=""; S.date=""; S.time=""; S.gameNo=""; S.homeAway="";
  S.players.forEach(p=>{p.out=false;p.reason="";});
  save(); render(); toast(logged?"Game logged to the season. Fresh slate.":"New game. Fresh slate.");
}

/* ---------- PDF output ----------
   Generates the two print documents as real letter-size PDFs (jsPDF, lazy-loaded
   like the Firebase SDK) so orientation/scale are baked in — the browser print
   dialog can't mangle them. Mac Chrome opens the PDF in a tab; iOS Safari shows
   it for share→Print. If jsPDF can't load (offline), the buttons fall back to
   the window.print() pipeline below. */
let jsPDFCtor=null;
function loadJsPDF(){
  return jsPDFCtor?Promise.resolve(jsPDFCtor):new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>{ jsPDFCtor=window.jspdf.jsPDF; res(jsPDFCtor); };
    s.onerror=()=>rej(new Error("jsPDF load failed"));
    document.head.appendChild(s);
  });
}
function openPdf(doc,name){
  const w=window.open(doc.output("bloburl"),"_blank");
  if(!w) doc.save(name); // popup blocked → download instead
}
function fitText(doc,txt,w){ txt=String(txt); while(doc.getTextWidth(txt)>w&&txt.length>1) txt=txt.slice(0,-1); return txt; }
const PDF_RED=[204,34,34], PDF_GREEN=[40,160,90];

function makeLineupPdf(){
  const doc=new jsPDFCtor({orientation:"landscape",unit:"mm",format:"letter"});
  const X=8,Y=8,W=263.4,H=199.9,HH=13;
  doc.setDrawColor(0).setLineWidth(1).rect(X,Y,W,H);
  doc.setLineWidth(0.9).line(X,Y+HH,X+W,Y+HH);
  // header cells: [width, label, value, style]
  const dateStr=S.date?new Date(S.date+"T12:00:00").toLocaleDateString():"";
  const cells=[[20,null,"9v9","nine"],[22,null,null,"hv"],[30,"Date:",dateStr,""],[22,"Time:",S.time||"",""],
    [18,"Game #:",S.gameNo||"",""],[36,"Field:",S.field||"",""],[0,"Opponent:",S.opponent||"",""],
    [24,"Half Score:","",""],[24,"Final Score:","",""],[18,null,S.formation.replace(/[^0-9]/g,""),"fnum"]];
  const fixed=cells.reduce((a,c)=>a+c[0],0); cells[6][0]=W-fixed;
  let cx=X;
  cells.forEach((c,i)=>{
    const [wd,lab,val,st]=c;
    if(i>0){ doc.setLineWidth(0.4).line(cx,Y,cx,Y+HH); }
    if(st==="nine"){ doc.setFont("helvetica","bold").setFontSize(20).setTextColor(0);
      doc.text(val,cx+wd/2,Y+HH/2,{align:"center",baseline:"middle"}); }
    else if(st==="fnum"){ doc.setFont("helvetica","bold").setFontSize(20).setTextColor(...PDF_RED);
      doc.text(val,cx+wd/2,Y+HH/2,{align:"center",baseline:"middle",renderingMode:"stroke",charSpace:1}); }
    else if(st==="hv"){ doc.setFont("helvetica","normal").setFontSize(7).setTextColor(...PDF_RED);
      doc.setLineWidth(0.35).rect(cx+3,Y+2.6,3,3); doc.text("HOME",cx+7.5,Y+4.1,{baseline:"middle"});
      doc.rect(cx+3,Y+7.4,3,3); doc.text("VISITOR",cx+7.5,Y+8.9,{baseline:"middle"});
      if(S.homeAway){ doc.setFont("helvetica","bold").setFontSize(9).setTextColor(0);
        doc.text("X",cx+4.5,S.homeAway==="home"?Y+4.3:Y+9.1,{align:"center",baseline:"middle"}); } }
    else{ doc.setFont("helvetica","normal").setFontSize(7).setTextColor(...PDF_RED);
      doc.text(lab,cx+2,Y+4.6);
      const lw=doc.getTextWidth(lab);
      doc.setFont("helvetica","bold").setFontSize(9).setTextColor(0);
      doc.text(fitText(doc,val,wd-lw-5),cx+2+lw+1.5,Y+4.7); }
    cx+=wd;
  });
  // quadrants
  const qy0=Y+HH, qh=(H-HH)/2, qw=W/2;
  doc.setDrawColor(0).setLineWidth(0.7);
  doc.line(X+qw,qy0,X+qw,Y+H); doc.line(X,qy0+qh,X+W,qy0+qh);
  const rows=FORMATIONS[S.formation];
  for(let q=0;q<4;q++){
    const ox=X+(q%2)*qw, oy=qy0+(q>1?qh:0);
    doc.setFont("helvetica","bold").setFontSize(8).setTextColor(130,130,130);
    doc.text("L",ox+3,oy+5); doc.text("R",ox+qw-3,oy+5,{align:"right"});
    const benchH=8, by=oy+qh-2-benchH;
    const ry0=oy+4.5, rowh=(by-1.5-ry0)/rows.length, iw=qw-12, boxh=9;
    let gkY=0;
    rows.forEach((row,r)=>{
      const rowY=ry0+r*rowh;
      const bw=(row.length===2?0.34:0.27)*iw, gap=0.05*iw;
      const total=row.length*bw+(row.length-1)*gap;
      let bx=ox+6+(iw-total)/2;
      const boxY=rowY+(rowh-boxh)/2+1.2;
      row.forEach(label=>{
        const isGK=label==="GOAL KEEPER";
        if(isGK) gkY=boxY;
        doc.setFont("helvetica","bold").setFontSize(5.5).setTextColor(70,70,70);
        doc.text(label,bx+bw/2,boxY-1.2,{align:"center"});
        if(isGK){ doc.setDrawColor(...PDF_GREEN).setLineWidth(0.8); } else { doc.setDrawColor(0).setLineWidth(0.45); }
        doc.rect(bx,boxY,bw,boxh);
        const idx=rows.slice(0,r).reduce((a,rw)=>a+rw.length,0)+row.indexOf(label);
        const pid=S.quarters[q][idx], p=pid?byId(pid):null;
        if(p){ doc.setFont("helvetica","bold").setFontSize(10).setTextColor(0);
          doc.text(fitText(doc,p.name,bw-3),bx+1.8,boxY+boxh/2,{baseline:"middle"}); }
        bx+=bw+gap;
      });
    });
    doc.setFont("helvetica","bold").setFontSize(10).setTextColor(...PDF_RED);
    doc.text(QLAB[q],ox+qw-8,gkY+boxh/2,{align:"right",baseline:"middle"});
    // bench
    doc.setFont("helvetica","normal").setFontSize(5).setTextColor(90,90,90);
    doc.text("BENCH",ox+7.5,by+benchH-0.5,{angle:90});
    const onField=new Set(Object.values(S.quarters[q]));
    const bench=availablePlayers().filter(p=>!onField.has(p.id));
    const n=Math.max(4,bench.length), bx0=ox+9, per=(qw-15-(n-1)*2)/n;
    doc.setDrawColor(150,150,150).setLineWidth(0.3);
    for(let i=0;i<n;i++){
      doc.rect(bx0+i*(per+2),by,per,benchH);
      if(bench[i]){ doc.setFont("helvetica","normal").setFontSize(8).setTextColor(0);
        doc.text(fitText(doc,shortName(bench[i].name),per-2.5),bx0+i*(per+2)+1.3,by+benchH/2,{baseline:"middle"}); }
    }
  }
  return doc;
}

function makeGameCardPdf(){
  const doc=new jsPDFCtor({orientation:"portrait",unit:"mm",format:"letter"});
  const cw=98.95, chh=130.7;
  const dateStr=S.date?new Date(S.date+"T12:00:00").toLocaleDateString():"";
  const sorted=[...S.players].sort((a,b)=>lastFirst(a.name).localeCompare(lastFirst(b.name)));
  for(let k=0;k<4;k++){
    const ox=8+(k%2)*(cw+2), oy=8+(k>1?chh+2:0);
    doc.addImage(GAMECARD_BG,"PNG",ox,oy,cw,chh,"gcbg","FAST");
    doc.setTextColor(0);
    doc.setFont("helvetica","normal").setFontSize(6.5);
    [[0.1255,S.teamName],[0.148,S.teamColors],[0.1704,S.coach],[0.1933,S.assCoach]].forEach(([f,txt])=>{
      if(txt) doc.text(fitText(doc,txt,0.6*cw),ox+0.216*cw,oy+f*chh,{baseline:"middle"});
    });
    sorted.slice(0,20).forEach((p,i)=>{
      const yc=oy+(0.2473+i*0.02911+0.0146)*chh;
      if(p.num) doc.text(String(p.num),ox+0.045*cw,yc,{baseline:"middle"});
      const nx=ox+0.162*cw, nm=fitText(doc,lastFirst(p.name),0.36*cw);
      doc.text(nm,nx,yc,{baseline:"middle"});
      if(p.out){
        doc.setDrawColor(0).setLineWidth(0.2).line(nx,yc,nx+doc.getTextWidth(nm),yc);
        doc.setFont("helvetica","italic").setFontSize(5.5);
        doc.text("absent"+(p.reason?" — "+p.reason.toLowerCase():""),nx+doc.getTextWidth(nm)+1.5,yc,{baseline:"middle"});
        doc.setFont("helvetica","normal").setFontSize(6.5);
      }
    });
    [[0.216,dateStr],[0.513,S.time||""],[0.842,S.field||""]].forEach(([f,txt])=>{
      if(txt) doc.text(String(txt),ox+f*cw,oy+0.897*chh,{align:"center"});
    });
  }
  return doc;
}

/* ---------- boot ---------- */
function boot(){
  const fsel=$("#formation");
  Object.keys(FORMATIONS).forEach(f=>{
    const o=document.createElement("option"); o.value=f; o.textContent=f+" (9v9)"; fsel.appendChild(o);
  });
  fsel.onchange=()=>{
    const n=flatPositions(fsel.value).length;
    S.formation=fsel.value;
    S.quarters.forEach(qt=>{ for(const k in qt){ if(+k>=n) delete qt[k]; } });
    save(); render();
  };
  const ssel=$("#schedsel");
  const time12=t=>{const [h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";return ((h%12)||12)+":"+String(m).padStart(2,"0")+" "+ap;};
  const now=new Date();
  const todayStr=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  const nextIdx=SCHEDULE.findIndex(g=>g.date>=todayStr);
  const ph=document.createElement("option"); ph.value=""; ph.textContent="Load game from schedule…"; ssel.appendChild(ph);
  SCHEDULE.forEach((g,i)=>{
    const d=new Date(g.date+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
    const o=document.createElement("option"); o.value=i;
    o.textContent=d+" · "+time12(g.time)+" vs "+g.opp+" ("+g.ha+", "+g.field+")"+(i===nextIdx?" — next":"");
    ssel.appendChild(o);
  });
  ssel.onchange=()=>{
    const g=SCHEDULE[+ssel.value]; if(!g){return;}
    S.opponent=g.opp; S.date=g.date; S.time=g.time; S.field=g.field; S.homeAway=g.ha;
    save(); render(); ssel.value="";
    toast("vs "+g.opp+" — "+g.ha.toUpperCase()+", "+g.field+", "+time12(g.time)+".");
  };
  [["f-opp","opponent"],["f-date","date"],["f-time","time"],["f-num","gameNo"],["f-field","field"],["f-ha","homeAway"],
   ["f-team","teamName"],["f-colors","teamColors"],["f-coach","coach"],["f-ass","assCoach"]].forEach(([id,key])=>{
    $("#"+id).addEventListener("input",e=>{ S[key]=e.target.value; save(); });
  });
  $("#fillgame").onclick=fillGame;
  $("#cleargame").onclick=()=>{ if(confirm("Clear all four quarters?")){ S.quarters=[{},{},{},{}]; save(); render(); } };
  $("#addbtn").onclick=()=>{
    const n=$("#newname").value.trim(); if(!n) return;
    S.players.push({id:"p"+(S.nextId++),name:n,num:"",out:false,reason:""});
    $("#newname").value=""; save(); render(); $("#rosterbox").open=true;
  };
  $("#sharebtn").onclick=shareLink;
  $("#newgame").onclick=newGame;
  $("#loggame").onclick=()=>logGame();
  $("#printbtn").onclick=()=>{
    if(jsPDFCtor){ openPdf(makeLineupPdf(),"lineup"+(S.date?"-"+S.date:"")+".pdf"); }
    else { setPrintMode("lineup"); buildPrintCard(); window.print(); }
  };
  $("#printgc").onclick=async()=>{
    if(jsPDFCtor){ openPdf(makeGameCardPdf(),"gamecard"+(S.date?"-"+S.date:"")+".pdf"); return; }
    setPrintMode("gamecard"); buildGameCard();
    // wait for the form image to decode — otherwise the print snapshot can race it and print a blank form
    try{ await Promise.all([...document.querySelectorAll("#printgame img")].map(i=>i.decode())); }catch(e){}
    window.print(); };
  window.addEventListener("beforeprint",()=>{ 
    if(document.body.dataset.print==="gamecard") buildGameCard(); else buildPrintCard(); });
  window.addEventListener("afterprint",()=>setPrintMode("lineup"));
  $("#checkbtn").onclick=()=>{ renderBanner(); const r=ruleReport();
    toast(r.level==="ok"?"75% rule: all good.":"Check the banner below the tally.");
    $("#banner").scrollIntoView({behavior:"smooth",block:"center"}); };
  $("#gatego").onclick=gateSubmit;
  $("#gatecode").addEventListener("keydown",e=>{ if(e.key==="Enter") gateSubmit(); });
  if(!localStorage.getItem(GATEOK)) showGate(); // instant on fresh devices; auth state check refines it
  maybeLoadFromHash();
  initSync();
  render();
  buildGameCard(); // pre-warm: gets the form image decoded long before any print
  loadJsPDF().catch(()=>{}); // pre-load so print clicks can open the PDF synchronously (popup blockers)
}
boot();
</script>
